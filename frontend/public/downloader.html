<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Jade - First-Time Setup</title>
  <style>
    body {
      margin: 0;
      padding: 0;
      background-color: #0b0b0f;
      color: #e2e8f0;
      font-family: 'Courier New', Courier, monospace;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
      -webkit-app-region: drag; /* Frameless drag support */
    }
    .logo-container {
      margin-bottom: 20px;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .logo-container img {
      width: 100px;
      height: 100px;
      user-select: none;
      pointer-events: none;
    }
    .terminal {
      width: 80%;
      background: #13131a;
      border: 1px solid #27273a;
      border-radius: 0px; /* Square corners */
      padding: 20px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
      font-size: 13px;
      line-height: 1.6;
      text-align: left;
      -webkit-app-region: no-drag;
    }
    .title {
      font-weight: bold;
      color: #69d695; /* Jade green */
      margin-bottom: 12px;
      text-transform: uppercase;
      letter-spacing: 1px;
    }
    .progress-container {
      width: 100%;
      background-color: #1e1e2f;
      height: 12px;
      margin: 15px 0;
      border: 1px solid #3b3b4f;
    }
    .progress-bar {
      width: 0%;
      height: 100%;
      background-color: #69d695; /* Jade green */
      transition: width 0.1s ease;
    }
    .details {
      display: flex;
      justify-content: space-between;
      color: #a0aec0;
      font-size: 12px;
      margin-top: 5px;
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #69d695;
      margin-left: 4px;
      animation: blink 1s step-end infinite;
      vertical-align: middle;
    }
    @keyframes blink {
      from, to { background-color: transparent }
      50% { background-color: #69d695 }
    }
    .error-btn {
      display: none;
      margin-top: 15px;
      background: #c53030;
      color: white;
      border: 1px solid #fc8181;
      padding: 8px 16px;
      cursor: pointer;
      font-family: inherit;
      font-size: 12px;
      text-transform: uppercase;
      font-weight: bold;
    }
    .error-btn:hover {
      background: #9b2c2c;
    }
  </style>
</head>
<body>

  </div>
  <div class="terminal">
    <div class="title">&gt; First-Time Setup Wizard</div>
    <div id="status-text">> Verifying model package llama3.2:1b...</div>
    
    <div class="progress-container">
      <div id="progress-bar" class="progress-bar"></div>
    </div>
    
    <div class="details">
      <span id="progress-percent">0% Completed</span>
      <span id="progress-bytes">0 / 1.3 GB</span>
    </div>
    <span class="cursor" id="status-cursor"></span>
    
    <button id="retry-btn" class="error-btn">Retry Download</button>
  </div>

  <script>
    const OLLAMA_URL = 'http://localhost:11434';
    let ipcRenderer = null;
    try {
      ipcRenderer = require('electron').ipcRenderer;
    } catch (e) {
      console.warn('Electron IPC not available');
    }

    async function startDownload() {
      const statusText = document.getElementById('status-text');
      const progressBar = document.getElementById('progress-bar');
      const progressPercent = document.getElementById('progress-percent');
      const progressBytes = document.getElementById('progress-bytes');
      const retryBtn = document.getElementById('retry-btn');
      
      statusText.innerText = '> Connecting to local Ollama registry...';
      progressBar.style.width = '0%';
      progressPercent.innerText = '0% Completed';
      progressBytes.innerText = 'Initializing...';
      retryBtn.style.display = 'none';

      try {
        const response = await fetch(`${OLLAMA_URL}/api/pull`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ name: 'llama3.2:1b', stream: true })
        });

        if (!response.ok) {
          throw new Error(`Failed to request model pull: ${response.statusText}`);
        }

        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { done, value } = await reader.read();
          if (done) break;

          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n');
          buffer = lines.pop() || '';

          for (const line of lines) {
            if (!line.trim()) continue;
            try {
              const data = JSON.parse(line);
              
              if (data.status === 'pulling manifest') {
                statusText.innerText = '> Fetching model manifest from library...';
              } else if (data.status === 'downloading' && data.total) {
                const pct = Math.round((data.completed / data.total) * 100);
                progressBar.style.width = `${pct}%`;
                progressPercent.innerText = `${pct}% Completed`;
                
                const mbCompleted = (data.completed / (1024 * 1024)).toFixed(1);
                const mbTotal = (data.total / (1024 * 1024)).toFixed(1);
                progressBytes.innerText = `${mbCompleted} MB / ${mbTotal} MB`;
                statusText.innerText = `> Downloading model weights: ${pct}%...`;
              } else if (data.status === 'verifying sha256') {
                statusText.innerText = '> Verifying file integrity hashes...';
              } else if (data.status === 'writing manifest') {
                statusText.innerText = '> Writing manifest and registering model...';
              } else if (data.status === 'success') {
                progressBar.style.width = '100%';
                progressPercent.innerText = '100% Completed';
                statusText.innerText = '> Download successful! Initializing database...';
                
                setTimeout(() => {
                  if (ipcRenderer) {
                    ipcRenderer.send('downloader-complete');
                  }
                }, 1000);
                return;
              }
            } catch (err) {
              console.error('Error parsing pull line:', err);
            }
          }
        }
      } catch (err) {
        statusText.innerText = `> Download failed: ${err.message}`;
        retryBtn.style.display = 'block';
      }
    }

    document.getElementById('retry-btn').addEventListener('click', startDownload);
    
    // Automatically trigger on window load after a brief pause
    window.addEventListener('load', () => {
      setTimeout(startDownload, 1000);
    });
  </script>
</body>
</html>
